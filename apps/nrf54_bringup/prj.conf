# M1 bring-up: console + OLED only.
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# Logging over the console UART
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Serial console + interrupt-driven single-letter commands (standing rule)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_REBOOT=y

# GPIO + I2C + display (SSD1306 via CFB)
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y

# CFB allocates its framebuffer from the system heap (k_malloc).
CONFIG_HEAP_MEM_POOL_SIZE=4096
