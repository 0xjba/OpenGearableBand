# Button + battery + production boot-survival (see src/resilience.h).
CONFIG_CPP=y
CONFIG_STD_CPP17=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Serial console (standing rule). NOTE: on this board the CMSIS-DAP bridge is
# output-only, so host->device input does not currently reach the app.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_REBOOT=y

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_I2C_GPIO=y

# PMIC: the charger node and ALL its values come from Seeed's official board
# definition, including charging-enable. These options only pull in the drivers
# that board nodes require -- no parameters are set here.
CONFIG_SENSOR=y
CONFIG_MFD=y
CONFIG_NPM13XX_CHARGER=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_NPM13XX=y

# Persistent boot counter -- NVS, not RAM: a brownout loop wipes RAM, so a RAM
# counter would never reach the safe-mode threshold.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# Watchdog: without this a hang is permanent and invisible.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y

# BLE peripheral: LBS (button) + BAS (battery %) + a status string characteristic
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="gband-btn"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=16
CONFIG_BT_LBS=y
# No CONFIG_BT_BAS: the Battery Service carries a 0-100% state of charge, and we
# have no defensible way to produce one for this cell (see src/battery.h).
# Voltage, current, temperature and charge status go out on the status
# characteristic instead -- all real measurements.
