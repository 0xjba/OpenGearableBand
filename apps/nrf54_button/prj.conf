# Button + battery + production boot-survival (see src/resilience.h).
CONFIG_CPP=y
CONFIG_STD_CPP17=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Serial console (standing rule). NOTE: on this board the CMSIS-DAP bridge is
# output-only, so host->device input does not currently reach the app.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_REBOOT=y

CONFIG_GPIO=y
CONFIG_I2C=y

# Battery / charge status from the onboard nPM1300 (READ-ONLY: no regulator
# control, no charging-enable -- see apps/nrf54_button/app.overlay).
CONFIG_SENSOR=y
CONFIG_MFD=y
CONFIG_NPM13XX_CHARGER=y

# Persistent boot counter -- NVS, not RAM: a brownout loop wipes RAM, so a RAM
# counter would never reach the safe-mode threshold.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# Watchdog: without this a hang is permanent and invisible.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y

# BLE peripheral: LBS (button) + BAS (battery %) + a status string characteristic
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="gband-btn"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=16
CONFIG_BT_LBS=y
CONFIG_BT_BAS=y
