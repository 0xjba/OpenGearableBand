# M3a: console + nPM1300 regulator + LSM6DS3TR-C IMU (serial-only bring-up).
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_FPU=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Serial console + r/b/g commands
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_REBOOT=y

CONFIG_GPIO=y
CONFIG_I2C=y

# nPM1300 PMIC regulator (powers the IMU/mic rail via LDO1)
CONFIG_REGULATOR=y
CONFIG_REGULATOR_NPM13XX=y
CONFIG_MFD=y

# IMU. ODR is an INDEX (0=power-down, 1=12.5Hz, 2=26, 3=52, 4=104Hz, ...).
# 0 (default) leaves the sensor powered down -> stale/frozen data. Index 4 =
# 104 Hz continuous (~ the 100 Hz the nRF52840 acq path uses).
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_ACCEL_ODR=4
CONFIG_LSM6DSL_GYRO_ODR=4
