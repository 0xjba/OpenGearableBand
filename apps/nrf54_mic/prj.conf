# M3c.1: console + nPM1300 (mic rail) + PDM mic + mic_vad (CMSIS FFT VAD).
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# FPU + CMSIS-DSP for the voiced-band rFFT + RMS (mic_vad)
CONFIG_FPU=y
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_FASTMATH=y
CONFIG_CMSIS_DSP_COMPLEXMATH=y
CONFIG_CMSIS_DSP_STATISTICS=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_REBOOT=y

CONFIG_GPIO=y
CONFIG_I2C=y

# nPM1300 LDO1 powers the mic rail
CONFIG_REGULATOR=y
CONFIG_REGULATOR_NPM13XX=y
CONFIG_MFD=y

# PDM mic
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
