# MAX30105 GREEN-LED PPG probe test.
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_MAX30101=y

# DIAGNOSTIC: light ALL THREE LEDs -- slot1 red(LED1), slot2 IR(LED2),
# slot3 green(LED3) -- to see which actually emit on this part.
CONFIG_MAX30101_MULTI_LED_MODE=y
CONFIG_MAX30101_SLOT1=1
CONFIG_MAX30101_SLOT2=2
CONFIG_MAX30101_SLOT3=3
CONFIG_MAX30101_SLOT4=0

# Red/IR at ~10 mA (already known good); GREEN at MAX current (0xff ~= 50 mA)
# so if a green LED exists at all, it cannot fail to show. [USER]/[UNIT]
CONFIG_MAX30101_LED1_PA=0x33
CONFIG_MAX30101_LED2_PA=0x33
CONFIG_MAX30101_LED3_PA=0xff

# 100 Hz sample rate -- plenty for HR, easy to watch the pulse. [UNIT]
CONFIG_MAX30101_SR=1

# USB-CDC console: log + the standing 'b'/'r' commands
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_REBOOT=y

CONFIG_MAIN_STACK_SIZE=4096
