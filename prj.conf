# Core OS & C++
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# Hardware Math (FPU)
CONFIG_FPU=y
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FILTERING=y
CONFIG_CMSIS_DSP_FASTMATH=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_STATISTICS=y
CONFIG_CMSIS_DSP_COMPLEXMATH=y

# Peripherals & Sensors
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LOG=y
CONFIG_MAX30101=y
CONFIG_MAX30101_SPO2_MODE=y
# Chip-internal sample rate must equal the polling rate (driver reads 1 FIFO
# entry per sensor_sample_fetch and does not check FIFO occupancy).
# 1 = 100 Hz; matches SAMPLE_RATE in WearableDSP.h.
CONFIG_MAX30101_SR=1
# IR LED drive current (used as the PPG source on the wrist).
# Driver default is 0x33 = ~10 mA, which is on the low end and produces a
# weak AC component that lets the 2x cardiac harmonic dominate the
# autocorrelation.  0x66 = ~20 mA is the standard wrist-PPG drive level.
# Scale: 0x00=0 mA, 0xff=50 mA, linear (~0.2 mA / LSB).
CONFIG_MAX30101_LED2_PA=0x66
# LSM6DSL default ODR is "select at runtime" (chip stays powered down).
# 4 = 104 Hz, the closest available to our 100 Hz polling cadence.
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_ACCEL_ODR=4

# Threading & Memory
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

# BLE Configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Xiao_Pulse"
CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_BT_HRS=y
CONFIG_BT_BAS=y

# ADC for Battery reading
CONFIG_ADC=y

# USB CDC ACM Console (configured via board defaults)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# sys_reboot() for the serial-triggered reset command
CONFIG_REBOOT=y
