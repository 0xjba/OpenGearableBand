# Core OS & C++
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# Hardware Math (FPU)
CONFIG_FPU=y
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FILTERING=y
CONFIG_CMSIS_DSP_FASTMATH=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_STATISTICS=y
CONFIG_CMSIS_DSP_COMPLEXMATH=y

# Peripherals & Sensors
CONFIG_I2C=y
CONFIG_I2S=y
CONFIG_SENSOR=y
CONFIG_LOG=y
CONFIG_MAX30101=y
CONFIG_MAX30101_SPO2_MODE=y
# Chip-internal sample rate must equal the polling rate (driver reads 1 FIFO
# entry per sensor_sample_fetch and does not check FIFO occupancy).
# 1 = 100 Hz; matches SAMPLE_RATE in WearableDSP.h.
CONFIG_MAX30101_SR=1
# IR LED drive current (used as the PPG source on the wrist).
# Driver default is 0x33 = ~10 mA, which is on the low end and produces a
# weak AC component that lets the 2x cardiac harmonic dominate the
# autocorrelation.  0x66 = ~20 mA is the standard wrist-PPG drive level.
# Scale: 0x00=0 mA, 0xff=50 mA, linear (~0.2 mA / LSB).
CONFIG_MAX30101_LED2_PA=0x66
# LSM6DSL default ODR is "select at runtime" (chip stays powered down).
# 4 = 104 Hz, the closest available to our 100 Hz polling cadence.
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_ACCEL_ODR=4
# Gyroscope enabled 2026-06-10 for the dictation-vs-air-mouse flip
# discriminator prototype.  The supination roll (about the forearm
# axis = band X) has a gyro signature a lean does not -- something
# the accelerometer is blind to (yaw about the gravity-aligned forearm
# axis).  104 Hz matches the accel/acq cadence; +/-1000 dps gives
# headroom so a brisk wrist flip (~peak 400-600 dps) doesn't clip.
# Power note: the gyro is the most power-hungry IMU block; for
# production it should be gated to only run during the raise
# transition, not always-on.
CONFIG_LSM6DSL_GYRO_ODR=4
CONFIG_LSM6DSL_GYRO_FS=1000

# Threading & Memory
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Power Management.
# CONFIG_PM enables Zephyr's PM policy: when the kernel has no runnable
# threads and no near-term timer, the policy picks the deepest allowed
# CPU sleep state.  On nRF52840 with the default policy that means
# SUSPEND-TO-IDLE (System ON sleep, WFI).  RAM is retained, the RTC
# keeps ticking (so k_timer / k_sleep still wake on schedule), and the
# BLE controller keeps its own radio scheduling.  Typical idle current
# drops from ~5 mA (full-run) to a few tens of µA plus radio events.
# CONFIG_PM_DEVICE is intentionally NOT enabled here -- our peripheral
# power control (MAX30102 SHDN, LSM6DSL embedded engines) is done by
# hand via direct I2C writes, not by the device PM framework.
CONFIG_PM=y

# BLE Configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Xiao_Pulse"
CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_BT_HRS=y
CONFIG_BT_BAS=y

# BLE security + bonded-pairing + persistent settings storage.  Kept as
# foundation infra: settings_load() at bt_ready() and the 'u' serial
# command (bt_unpair) rely on CONFIG_BT_SETTINGS + SMP, and bond storage
# lets a host avoid re-pairing every connection.
CONFIG_BT_SMP=y
CONFIG_BT_SIGNING=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
# Allow up to 4 bonded hosts (phone + computer + 2 spare slots).
CONFIG_BT_MAX_PAIRED=4

# ADC for Battery reading
CONFIG_ADC=y

# microSD over SPI + FAT filesystem.  PRIMARY future role: WRITING/recording
# audio to SD; the only read path today is the TEST-ONLY WAV playback that
# exercises audio_out with real audio.  Proven config from spkr_test/.
CONFIG_SPI=y
CONFIG_SDHC=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# USB CDC ACM Console (configured via board defaults)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
# RX needs the interrupt API.  The cdc_acm driver only delivers received
# bytes via its IRQ path; uart_poll_in() returns -1 indefinitely on it
# in this NCS version (logs went out fine but typed commands never
# reached the firmware -- reproduced in screen, so not Arduino-IDE-side).
# Enabling this lets us use uart_irq_callback_user_data_set + uart_irq_rx_enable.
CONFIG_UART_INTERRUPT_DRIVEN=y

# sys_reboot() for the serial-triggered reset command
CONFIG_REBOOT=y

# PDM microphone (dictation entry A.0)
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_AUDIO_DMIC_NRFX_PDM=y

# Dictation audio stream (sub-project B): LC3 encode + custom BLE notify service.
# LC3 codec (Google liblc3, shipped in NCS as a Zephyr module).
CONFIG_LIBLC3=y
# FPU context must be saved across context switches: the LC3 encoder runs on the
# mic capture thread, alongside the CMSIS-DSP FFT VAD and the float math on the
# acq/DSP threads. CONFIG_FPU is already enabled above; sharing makes multi-thread
# FPU use correct.
CONFIG_FPU_SHARING=y
# BLE throughput for the 82-byte audio notification ([seq16][80B LC3 block]).
# Default ATT MTU (23) caps a notification at 20 bytes, far too small -- raise it.
# DLE lets the whole frame ride in one link-layer PDU. TX buf count gives the
# capture thread queueing headroom (tuned from observed [AUD] drops).
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_L2CAP_TX_BUF_COUNT=12

# To re-measure per-thread stack peaks (right-sizing), temporarily add:
#   CONFIG_THREAD_NAME=y / CONFIG_INIT_STACKS=y / CONFIG_THREAD_ANALYZER=y
#   CONFIG_THREAD_ANALYZER_USE_LOG=y / CONFIG_THREAD_ANALYZER_AUTO=y
#   CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=20 / CONFIG_LOG_BUFFER_SIZE=8192
# (2026-06-21 measurement: dl_thread decode peak 2784 B -> DL_THREAD_STACK=4096.)
