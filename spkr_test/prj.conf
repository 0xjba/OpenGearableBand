# SD-card WAV player test (MAX98357A) -- stock Zephyr i2s_nrfx + SPI SD + FatFs.
CONFIG_I2S=y
CONFIG_GPIO=y

# microSD over SPI + FAT filesystem
CONFIG_SPI=y
CONFIG_SDHC=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# math (tone gen removed, but keep newlib for the build) + FPU
CONFIG_NEWLIB_LIBC=y
CONFIG_FPU=y

# USB-CDC console: startup log + the standing 'b'/'r' commands
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_REBOOT=y

# FatFs + file I/O need a roomier main stack
CONFIG_MAIN_STACK_SIZE=8192
